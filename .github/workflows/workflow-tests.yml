name: Workflow regression tests

on:
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/test_monitor_workflows.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/test_monitor_workflows.py"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/test_monitor_workflows.py
