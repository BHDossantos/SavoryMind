name: Nocturna CI

on:
  push:
    paths: ["nocturna/**", ".github/workflows/nocturna-ci.yml"]
  pull_request:
    paths: ["nocturna/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: nocturna/backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: nocturna/backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: nocturna/frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: nocturna/frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx next build

  mobile-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: nocturna/mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: nocturna/mobile/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx expo install --check
      - run: npm run export -- --max-workers 2
        env:
          EXPO_NO_TELEMETRY: "1"

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: nocturna/frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: nocturna/frontend/package-lock.json }
      - run: pip install -r ../backend/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
