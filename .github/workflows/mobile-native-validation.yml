name: Mobile Native Validation

# Compile test binaries on GitHub runners. No EAS, store upload, or credentials.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-native-validation.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-native-validation.yml'

permissions:
  contents: read

concurrency:
  group: mobile-native-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_URL: https://api.example.invalid

jobs:
  android:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install locked mobile dependencies
        run: npm ci --ignore-scripts
      - name: Generate Android project
        run: npx --no-install expo prebuild --platform android --no-install
      - name: Compile debug APK for device and emulator
        working-directory: mobile/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            2>&1 | tee "$RUNNER_TEMP/savorymind-android-build.log"
      - uses: actions/upload-artifact@v4
        with:
          name: savorymind-android-debug-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: savorymind-android-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/savorymind-android-build.log
          if-no-files-found: ignore
          retention-days: 14

  ios:
    name: Compile iOS simulator app
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # SDK 55 requires Xcode 26.2+. macos-15 defaults to 16.4, so select
      # the installed compatible toolchain without changing machine settings.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify Xcode toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Install locked mobile dependencies
        run: npm ci --ignore-scripts
      - name: Generate iOS project
        run: npx --no-install expo prebuild --platform ios --no-install
      - name: Install native pods
        working-directory: mobile/ios
        run: pod install
      - name: Compile without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace ios/SavoryMind.xcworkspace -scheme SavoryMind \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/savorymind-derived" \
            CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/savorymind-ios-build.log"
      - name: Package simulator app
        run: |
          APP="$RUNNER_TEMP/savorymind-derived/Build/Products/Debug-iphonesimulator/SavoryMind.app"
          test -d "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/savorymind-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: savorymind-ios-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/savorymind-simulator.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: savorymind-ios-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/savorymind-ios-build.log
          if-no-files-found: ignore
          retention-days: 14
