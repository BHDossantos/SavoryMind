# Weekly grouped dependency updates: one PR per ecosystem per week instead of
# a pile of single-package PRs. Security updates still arrive on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # react and react-dom must move together, and jest-dom 8 and
      # jest-environment-jsdom 30 need Jest 30. Upgrade these on purpose.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: jest-environment-jsdom
        update-types: ["version-update:semver-major"]
    groups:
      npm-frontend-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/mobile"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Expo packages are pinned to one SDK (55). A major bump to a single
      # package moves it to another SDK and breaks npm ci; upgrade the SDK
      # as one deliberate change instead.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-mobile-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip-backend-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-frontend-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-backend-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
